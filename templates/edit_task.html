{% extends "base.html" %}

{% block title %}Edit Task — SmartDay{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="mb-4">
                <p class="text-primary text-uppercase fw-semibold mb-2 small">
                    Task Management
                </p>
                <h1 class="h2 fw-bold mb-0">Edit Task</h1>
            </div>

            <div class="card border shadow">
                <div class="card-body p-4 p-md-5">

                    <form class="needs-validation" novalidate action="{{ url_for('edit_task', task_id=task.id) }}"
                        method="POST">

                        {% if success %}
                        <div class="alert alert-success" role="alert">{{ success }}</div>
                        {% endif %}

                        {% if error %}
                        <div class="alert alert-danger" role="alert">{{ error }}</div>
                        {% endif %}

                        <!-- Title -->
                        <div class="mb-3">
                            <label for="title" class="form-label">
                                Task Title
                            </label>
                            <input type="text" class="form-control" id="title" name="title" value="{{ task.title }}"
                                required>
                        </div>

                        <!-- Category -->
                        <div class="mb-3">
                            <label for="category" class="form-label">
                                Category
                            </label>
                            <input type="text" class="form-control" id="category" name="category"
                                value="{{ task.category }}" required>
                        </div>

                        <div class="row">
                            <!-- Priority -->
                            <div class="col-md-6 mb-3">
                                <label for="priority" class="form-label">
                                    Priority
                                </label>

                                <select class="form-select" id="priority" name="priority" required>
                                    <option value="Low" {% if task.priority=='Low' %}selected{% endif %}>
                                        Low
                                    </option>

                                    <option value="Medium" {% if task.priority=='Medium' %}selected{% endif %}>
                                        Medium
                                    </option>

                                    <option value="High" {% if task.priority=='High' %}selected{% endif %}>
                                        High
                                    </option>
                                </select>
                            </div>

                            <!-- Status -->
                            <div class="col-md-6 mb-3">
                                <label for="status" class="form-label">
                                    Status
                                </label>

                                <select class="form-select" id="status" name="status" required>
                                    <option value="pending" {% if task.status=='pending' %}selected{% endif %}>
                                        Pending
                                    </option>

                                    <option value="in_progress" {% if task.status=='in_progress' %}selected{% endif %}>
                                        In Progress
                                    </option>

                                    <option value="completed" {% if task.status=='completed' %}selected{% endif %}>
                                        Completed
                                    </option>
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <!-- Deadline -->
                            <div class="col-md-6 mb-3">
                                <label for="deadline" class="form-label">
                                    Deadline
                                </label>

                                <input type="date" class="form-control" id="deadline" name="deadline"
                                    value="{{ task.deadline.strftime('%Y-%m-%d') if task.deadline else '' }}" required>
                            </div>

                            <!-- Estimated Hours -->
                            <div class="col-md-6 mb-3">
                                <label for="estimated_hours" class="form-label">
                                    Estimated Hours <span class="text-secondary fw-normal small">(Optional)</span>
                                </label>

                                <input type="number" step="0.5" min="0" class="form-control" id="estimated_hours"
                                    name="estimated_hours"
                                    value="{{ task.estimated_hours if task.estimated_hours else '' }}">
                            </div>
                        </div>

                        <!-- Buttons -->
                        <div class="d-flex justify-content-end gap-2 mt-4">

                            <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary">
                                Cancel
                            </a>

                            <button type="submit" class="btn btn-primary fw-semibold">
                                Save Changes
                            </button>

                        </div>

                    </form>

                    <p class="text-center text-secondary mt-4 mb-0 small">
                        <a href="{{ url_for('dashboard') }}" class="text-decoration-none">Back to Dashboard</a>
                    </p>

                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
