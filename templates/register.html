{% extends "base.html" %}

{% block title %}Register — SmartDay{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border shadow">
                <div class="card-body p-4 p-md-5">
                    <h2 class="text-center mb-1 fw-bold">Create your account</h2>
                    <p class="text-center text-secondary mb-4">Start organizing your semester with SmartDay</p>

                    {% if success %}
                    <div class="alert alert-success" role="alert">{{ success }}</div>
                    {% endif %}

                    {% if error %}
                    <div class="alert alert-danger" role="alert">{{ error }}</div>
                    {% endif %}

                    <form action="{{ url_for('register') }}" method="POST">
                        <div class="mb-3">
                            <label class="form-label" for="name">Name</label>
                            <input type="text" class="form-control" id="name" name="name" placeholder="Your full name" value="{{ name }}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="email">Email</label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="you@university.edu" value="{{ email }}" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label" for="password">Password</label>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Create a password" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 fw-semibold">
                            Register
                        </button>
                    </form>

                    <p class="text-center text-secondary mt-4 mb-0 small">
                        Already have an account?
                        <a href="{{ url_for('login') }}" class="text-decoration-none">Login</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
